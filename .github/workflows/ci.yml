name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: global.json
      - name: Restore
        run: dotnet restore NetMind.slnx
      - name: Build
        run: dotnet build NetMind.slnx -c Release --no-restore
      - name: Core smoke tests
        run: dotnet run --project src/NetMind.SmokeTests/NetMind.SmokeTests.csproj -c Release --no-build
      - name: Publish self-contained package
        shell: powershell
        run: ./packaging/publish-win-x64.ps1 -Version 0.8.0 -SkipArchive
      - name: Verify release manifest and layout
        shell: powershell
        run: ./packaging/verify-release.ps1 -Version 0.8.0
