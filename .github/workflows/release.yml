name: Release package

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v
        required: true
        default: 0.8.0

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302
      - id: version
        name: Resolve version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $version = '${{ inputs.version }}'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Restore and build
        run: |
          dotnet restore NetMind.slnx
          dotnet build NetMind.slnx -c Release --no-restore
      - name: Full smoke tests
        run: dotnet run --project src/NetMind.SmokeTests/NetMind.SmokeTests.csproj -c Release --no-build
      - name: Publish archive
        shell: powershell
        run: ./packaging/publish-win-x64.ps1 -Version '${{ steps.version.outputs.value }}'
      - name: Verify release
        shell: powershell
        run: ./packaging/verify-release.ps1 -Version '${{ steps.version.outputs.value }}'
      - uses: actions/upload-artifact@v4
        with:
          name: NetMind-AI-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/NetMind-AI-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/NetMind-AI-${{ steps.version.outputs.value }}-win-x64.zip.sha256
          if-no-files-found: error
